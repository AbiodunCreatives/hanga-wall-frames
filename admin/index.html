<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hanga – Orders</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@400;700&display=swap">
  <link rel="stylesheet" href="/admin/admin.css?v=1">
</head>
<body class="page-login">

<!-- ─── Login screen ────────────────────────────────────────── -->
<div class="login-wrap" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">HANGA<span>.</span></div>
    <p class="login-sub">Order Management</p>
    <form id="loginForm" autocomplete="off">
      <label for="pinInput" class="login-label">Admin PIN</label>
      <input type="password" id="pinInput" class="login-input" inputmode="numeric"
             placeholder="••••••" autocomplete="current-password" maxlength="12" required>
      <p class="login-error" id="loginError" hidden></p>
      <button type="submit" class="login-btn" id="loginBtn">Sign in</button>
    </form>
  </div>
</div>

<!-- ─── Dashboard ──────────────────────────────────────────── -->
<div class="dash" id="dashboard" hidden>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">HANGA<span>.</span></div>
    <nav class="sidebar-nav">
      <button class="snav-item active" data-filter="" onclick="setFilter('',this)">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/></svg>
        All Orders
        <span class="snav-count" id="cntAll">0</span>
      </button>
      <button class="snav-item" data-filter="paid" onclick="setFilter('paid',this)">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Paid – Unprocessed
        <span class="snav-count" id="cntPaid">0</span>
      </button>
      <button class="snav-item" data-filter="processing" onclick="setFilter('processing',this)">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v3M12 18v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M3 12h3M18 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Processing
        <span class="snav-count" id="cntProcessing">0</span>
      </button>
      <button class="snav-item" data-filter="shipped" onclick="setFilter('shipped',this)">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 17H3a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="9" y="11" width="14" height="10" rx="1" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="21" r="1.5" stroke="currentColor" stroke-width="1.5"/><circle cx="20" cy="21" r="1.5" stroke="currentColor" stroke-width="1.5"/></svg>
        Shipped
        <span class="snav-count" id="cntShipped">0</span>
      </button>
      <button class="snav-item" data-filter="delivered" onclick="setFilter('delivered',this)">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="1.8"/><polyline points="9 22 9 12 15 12 15 22" stroke="currentColor" stroke-width="1.8"/></svg>
        Delivered
        <span class="snav-count" id="cntDelivered">0</span>
      </button>
      <button class="snav-item" data-filter="cancelled" onclick="setFilter('cancelled',this)">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M15 9l-6 6M9 9l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Cancelled
        <span class="snav-count" id="cntCancelled">0</span>
      </button>
    </nav>
    <div class="sidebar-footer">
      <div class="revenue-box">
        <span class="revenue-label">Total Revenue</span>
        <span class="revenue-val" id="revenueVal">₦0</span>
      </div>
      <button class="signout-btn" onclick="signOut()">Sign out</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">

    <!-- Top bar -->
    <div class="topbar">
      <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input type="search" id="searchInput" class="search-input" placeholder="Search by name, ref, phone…" oninput="onSearch()">
      </div>
      <button class="refresh-btn" onclick="loadOrders()" title="Refresh">
        <svg viewBox="0 0 24 24" fill="none"><path d="M23 4v6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <!-- Stats strip -->
    <div class="stats-strip">
      <div class="stat-card">
        <span class="stat-val" id="statTotal">0</span>
        <span class="stat-label">Total Orders</span>
      </div>
      <div class="stat-card stat-card--gold">
        <span class="stat-val" id="statRevenue">₦0</span>
        <span class="stat-label">Total Revenue</span>
      </div>
      <div class="stat-card">
        <span class="stat-val" id="statPending">0</span>
        <span class="stat-label">Need Action</span>
      </div>
      <div class="stat-card">
        <span class="stat-val" id="statDelivered">0</span>
        <span class="stat-label">Delivered</span>
      </div>
    </div>

    <!-- Order table -->
    <div class="table-wrap">
      <div class="table-loading" id="tableLoading">
        <div class="spinner"></div>
        <span>Loading orders…</span>
      </div>
      <div class="table-empty" id="tableEmpty" hidden>
        <svg viewBox="0 0 48 48" fill="none"><rect x="8" y="12" width="32" height="28" rx="2" stroke="currentColor" stroke-width="2"/><path d="M16 20h16M16 27h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <p>No orders yet.</p>
      </div>
      <div class="table-error" id="tableError" hidden>
        <svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="2"/><path d="M24 14v12M24 32v2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        <p>Could not load orders.</p>
        <p class="table-error-msg" id="tableErrorMsg"></p>
        <button class="page-btn" onclick="loadOrders()" style="margin-top:8px">Try again</button>
      </div>
      <table class="orders-table" id="ordersTable" hidden>
        <thead>
          <tr>
            <th>Order</th>
            <th>Customer</th>
            <th>Items</th>
            <th>Total</th>
            <th>Date</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="ordersBody"></tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="pagination" id="pagination" hidden>
      <button class="page-btn" id="pagePrev" onclick="goPage(-1)">← Prev</button>
      <span class="page-info" id="pageInfo"></span>
      <button class="page-btn" id="pageNext" onclick="goPage(1)">Next →</button>
    </div>

  </main>
</div>

<!-- ─── Order detail drawer ─────────────────────────────────── -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer" aria-label="Order detail" role="dialog" aria-modal="true">
  <div class="drawer-header">
    <h2 class="drawer-title" id="drawerTitle">Order</h2>
    <button class="drawer-close" onclick="closeDrawer()" aria-label="Close">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<script src="/admin/admin.js?v=1"></script>
</body>
</html>
